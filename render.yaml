services:
  - type: web
    name: hlbbusisup-ai-decision-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://hlbbusisup-creator.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: hlbbusisup-ai-decision-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true

databases:
  - name: hlbbusisup-ai-decision-db
    databaseName: ai_decision_system
    user: ai_decision_user
